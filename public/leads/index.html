<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lead Desk · Workboard</title>
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<script src="/leads/shim.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky header with tabs; four views (Today, Pipeline, Review, Routing); lead editor slides in from the right, organized by the 10-step process. */
/* Liquid Glass: frosted translucent surfaces over a soft colour wash; capsule controls; floating tab bar. */
:root{
  --bg:#edf2f8; --surface:rgba(255,255,255,.62); --sunk:rgba(255,255,255,.42); --ink:#0f141a; --muted:#566170; --line:rgba(20,32,56,.10);
  --accent:#0a6cf0; --accent-ink:#ffffff; --accent-soft:rgba(10,108,240,.14);
  --hot:#dc3f1a; --hot-soft:rgba(232,72,30,.14); --warm:#a86a00; --warm-soft:rgba(240,160,10,.18);
  --nurture:#5149d1; --nurture-soft:rgba(88,80,220,.14); --dq:#66707c; --dq-soft:rgba(110,118,130,.14);
  --good:#178a4a; --bad:#d0302a;
  --glass:rgba(255,255,255,.56); --glass-strong:rgba(255,255,255,.78); --glass-solid:rgba(250,252,255,.97);
  --field:rgba(255,255,255,.72); --pill:rgba(255,255,255,.92); --edge:rgba(255,255,255,.78); --hi:rgba(255,255,255,.85);
  --shadow:0 10px 30px rgba(32,52,92,.10), 0 1px 2px rgba(32,52,92,.06);
  --blur:blur(24px) saturate(180%);
  --wash1:rgba(120,220,200,.55); --wash2:rgba(130,180,255,.55); --wash3:rgba(255,190,160,.50); --wash4:rgba(200,170,255,.45);
  --f-display:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-body:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0f17; --surface:rgba(30,37,48,.6); --sunk:rgba(255,255,255,.06); --ink:#eef2f7; --muted:#9ba6b5; --line:rgba(255,255,255,.10);
  --accent:#4a94ff; --accent-ink:#ffffff; --accent-soft:rgba(74,148,255,.22);
  --hot:#ff7d5c; --hot-soft:rgba(255,125,92,.18); --warm:#ffc24f; --warm-soft:rgba(255,194,79,.16);
  --nurture:#9b97ff; --nurture-soft:rgba(155,151,255,.18); --dq:#9ca5b0; --dq-soft:rgba(156,165,176,.16);
  --good:#4fd38c; --bad:#ff7b72;
  --glass:rgba(32,39,51,.55); --glass-strong:rgba(28,34,45,.80); --glass-solid:rgba(22,27,36,.97);
  --field:rgba(255,255,255,.07); --pill:rgba(255,255,255,.14); --edge:rgba(255,255,255,.13); --hi:rgba(255,255,255,.08);
  --shadow:0 12px 36px rgba(0,0,0,.40), 0 1px 2px rgba(0,0,0,.3);
  --wash1:rgba(20,120,120,.42); --wash2:rgba(40,70,170,.48); --wash3:rgba(120,50,90,.35); --wash4:rgba(80,50,160,.38);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a0f17; --surface:rgba(30,37,48,.6); --sunk:rgba(255,255,255,.06); --ink:#eef2f7; --muted:#9ba6b5; --line:rgba(255,255,255,.10);
  --accent:#4a94ff; --accent-ink:#ffffff; --accent-soft:rgba(74,148,255,.22);
  --hot:#ff7d5c; --hot-soft:rgba(255,125,92,.18); --warm:#ffc24f; --warm-soft:rgba(255,194,79,.16);
  --nurture:#9b97ff; --nurture-soft:rgba(155,151,255,.18); --dq:#9ca5b0; --dq-soft:rgba(156,165,176,.16);
  --good:#4fd38c; --bad:#ff7b72;
  --glass:rgba(32,39,51,.55); --glass-strong:rgba(28,34,45,.80); --glass-solid:rgba(22,27,36,.97);
  --field:rgba(255,255,255,.07); --pill:rgba(255,255,255,.14); --edge:rgba(255,255,255,.13); --hi:rgba(255,255,255,.08);
  --shadow:0 12px 36px rgba(0,0,0,.40), 0 1px 2px rgba(0,0,0,.3);
  --wash1:rgba(20,120,120,.42); --wash2:rgba(40,70,170,.48); --wash3:rgba(120,50,90,.35); --wash4:rgba(80,50,160,.38);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px 0}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
#to-workboard{text-decoration:none;color:inherit;white-space:nowrap}
.brand-mark{align-self:center;flex:none;width:30px;height:24px;background:var(--ink);-webkit-mask:url(/brand/mark.svg) center/contain no-repeat;mask:url(/brand/mark.svg) center/contain no-repeat}
.brand h1{font-size:22px}
.brand span{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.small{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:4px;width:100%;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 14px 11px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{font-family:var(--f-mono);font-size:12px;margin-left:6px;color:var(--muted)}

.banner{background:var(--warm-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warm) 35%,transparent);border-radius:var(--r);padding:10px 14px;margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner b{color:var(--warm)}
main{padding-block:20px 60px}
.view{display:grid;gap:22px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:grid;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .v.alert{color:var(--hot)}
.kpi .l{color:var(--muted);font-size:12.5px}

/* lists on Today */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:22px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:baseline;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:16px;white-space:nowrap}
.panel-h .rule{color:var(--muted);font-size:12.5px;margin-left:auto;text-align:right}
.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:10px 16px 10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:var(--sunk)}
.item .stripe{align-self:stretch;border-radius:0 3px 3px 0}
.item .who{min-width:0}
.item .who b{font-weight:600}
.item .who .sub{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .when{text-align:right;font-size:12.5px}
.empty{padding:18px 16px;color:var(--muted)}
.late{color:var(--hot);font-weight:600}

/* tag pills */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-Hot{color:var(--hot);background:var(--hot-soft)}
.t-Warm{color:var(--warm);background:var(--warm-soft)}
.t-Nurture{color:var(--nurture);background:var(--nurture-soft)}
.t-Disqualify{color:var(--dq);background:var(--dq-soft)}
.t-Unqualified{color:var(--muted);background:transparent;border:1px dashed var(--line)}
.s-Hot{background:var(--hot)}.s-Warm{background:var(--warm)}.s-Nurture{background:var(--nurture)}.s-Disqualify{background:var(--dq)}.s-Unqualified{background:var(--line)}
.stage{font-size:12.5px;padding:2px 8px;border-radius:4px;background:var(--sunk);white-space:nowrap}
.stage.Won{background:var(--accent-soft);color:var(--accent);font-weight:600}
.stage.Lost,.stage.Disqualified{color:var(--muted)}

/* pipeline */
.stages{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip .n{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 10px;min-width:0}
.filters input[type=search]{flex:1 1 220px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:1000px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap;cursor:pointer;user-select:none}
th[data-sort]:hover{color:var(--ink)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
td .sub{color:var(--muted);font-size:12.5px;max-width:280px}
td.num,th.num{text-align:right}

/* review */
.period{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.period select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 10px}
.funnel{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.funnel .step{background:var(--surface);padding:16px;display:grid;gap:4px;position:relative}
.funnel .step .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1}
.funnel .step .rate{font-family:var(--f-mono);font-size:12.5px;color:var(--accent)}
.bars{display:grid;gap:8px;padding:14px 16px}
.bar-row{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:12px;align-items:center}
.bar-row .lbl{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:16px;background:var(--sunk);border-radius:3px;position:relative;overflow:hidden}
.track .b-all{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--accent) 28%,transparent);border-radius:3px}
.track .b-prop{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--accent) 55%,transparent);border-radius:3px}
.track .b-won{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.bar-row .nums{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap;min-width:92px;text-align:right}
.bar-row .nums b{color:var(--ink);font-weight:500}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:0 16px 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.insight{padding:12px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.insight b{color:var(--ink)}

/* routing */
.routing td input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 9px;width:100%;min-width:140px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;padding:16px}
.rule-card{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;align-content:start}
.rule-card p{margin:0;color:var(--muted);font-size:13px}

/* drawer */
.backdrop{position:fixed;inset:0;background:rgb(10 16 14 / .45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;border-left:1px solid var(--line);box-shadow:-12px 0 40px rgb(0 0 0 / .18)}
.d-head{background:var(--surface);border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 14px 18px;display:grid;gap:10px}
.d-head .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.d-head h2{font-size:20px;margin-right:auto;min-width:0;overflow-wrap:anywhere}
.d-body{flex:1;overflow-y:auto;padding:14px max(18px,env(safe-area-inset-right,0px)) 30px 18px;display:grid;gap:10px;align-content:start}
.d-foot{background:var(--surface);border-top:1px solid var(--line);padding:12px max(18px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.d-foot .msg{margin-right:auto;font-size:13px;color:var(--bad)}
.d-foot .msg.ok{color:var(--good)}
details.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.step>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:baseline}
details.step>summary::-webkit-details-marker{display:none}
details.step>summary .no{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:20px}
details.step>summary h3{font-size:15px}
details.step>summary .hint{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
details.step>summary::after{content:"+";font-family:var(--f-mono);color:var(--muted);margin-left:8px}
details.step[open]>summary::after{content:"−"}
details.step[open]>summary .hint{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 14px 16px}
.grid .full{grid-column:1/-1}
.field{display:grid;gap:4px;min-width:0}
.field label,.field .lab{font-size:12px;color:var(--muted);font-weight:500}
.field label .req{color:var(--hot)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
.field textarea{min-height:64px;resize:vertical}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 14px}
.checks label{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink)}
.checks input{accent-color:var(--accent);width:16px;height:16px}
.tagbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--sunk);border-radius:6px;font-size:13px}
.tagbox .why{color:var(--muted)}
.fu{display:grid;gap:6px}
.fu label{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--ink)}
.field .fu input,.field .checks input{width:16px;height:16px;flex:none;accent-color:var(--accent);padding:0}
.fu label .d{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.fu label .d.late{color:var(--hot)}
.statusline{font-size:12.5px;color:var(--muted)}

/* proposals */
.pst{display:inline-flex;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.ps-Draft{color:var(--muted);border:1px dashed var(--line)}
.ps-Sent{color:var(--nurture);background:var(--nurture-soft)}
.ps-Accepted{color:var(--accent);background:var(--accent-soft)}
.ps-Declined{color:var(--dq);background:var(--dq-soft)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 10px;min-width:0;max-width:100%}
.note{font-size:13px;color:var(--muted)}
.note b{color:var(--warm)}
.pe-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pe-bar h2{font-size:20px;margin-right:auto;min-width:0;overflow-wrap:anywhere}
.pe-msg{font-size:13px;color:var(--bad);min-height:1.2em}
.pe-msg.ok{color:var(--good)}
.pe{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:22px;align-items:start}
.pe-form{display:grid;gap:14px;min-width:0}
.pe-form .grid{padding-top:12px}
.lis{display:grid;gap:10px;padding:12px 16px}
.li{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);display:grid;gap:10px;padding:12px}
.li-h{display:flex;gap:6px;align-items:end}
.li-h .field{flex:1}
.li-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;min-width:32px;height:32px;line-height:1;font-size:14px;color:var(--muted)}
.iconbtn:hover{color:var(--ink);border-color:var(--muted)}
.sugs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 16px 12px}
.addrow{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px}
.addrow select{flex:1 1 220px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 10px;min-width:0}
.totals{display:grid;gap:5px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;padding:12px 16px 16px}
.totals div{display:flex;justify-content:space-between;gap:12px}
.totals .big{font-size:16px;font-weight:600;border-top:1px solid var(--line);padding-top:8px;margin-top:3px}
.pe-preview{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);max-height:calc(100vh - 132px);overflow:auto;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.pe-preview .pdoc{margin:10px auto 0;padding:32px 34px}
.plist{display:grid;gap:6px}
.plink{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;display:flex;gap:10px;align-items:center;width:100%;text-align:left}
.plink:hover{border-color:var(--muted)}
.plink .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catwrap{display:grid;gap:8px;padding:14px 16px}
.cat-item{display:grid;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:1000px){.pe{grid-template-columns:1fr}.pe-preview{position:static;max-height:none}}

/* client document (also used in the downloaded file) */
.pdoc{--pi:#18211d;--pm:#5b6762;--pl:#dde3df;--pa:#1d6b58;background:#fff;color:var(--pi);max-width:820px;margin:24px auto;padding:48px 52px;font-family:"Instrument Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.55;box-shadow:0 1px 3px rgb(0 0 0 / .12);border-radius:4px;color-scheme:light}

.pdoc .pd-for{margin-top:18px;display:flex;gap:48px;flex-wrap:wrap}

.pdoc .pd-item{padding:12px 0;border-bottom:1px solid var(--pl)}
.pdoc .pd-item:last-of-type{border-bottom:0}

.panel,.kpi,.funnel .step,.tbl-wrap,details.step,.banner,.rule-card,.pe-preview{

.kpis,.funnel{background:none;border:0;border-radius:0;overflow:visible;gap:12px}

.panel{overflow:hidden}
.panel .tbl-wrap,.panel details.step,.drawer details.step,.li,.rule-card,.catwrap details.step{
  background:var(--sunk);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;border-radius:16px}
.panel .tbl-wrap{background:transparent;border-radius:0}
.li{border:1px solid var(--line)}
.banner{background:linear-gradient(var(--warm-soft),var(--warm-soft)),var(--glass);border-color:var(--edge)}
.panel-h,th,td,.item,.insight,.cat-item{border-color:var(--line)}
th{background:transparent;color:var(--muted)}
tbody tr:hover,.item:hover{background:var(--sunk)}
.item .stripe{border-radius:0 4px 4px 0}
.track{background:var(--line);border-radius:999px}
.track .b-all,.track .b-prop,.track .b-won{border-radius:999px}

/* capsule controls */
.btn{border-radius:999px;padding:8px 16px;background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 1px 3px rgba(0,0,0,.06), inset 0 1px 0 var(--hi);transition:transform .12s ease, filter .12s ease}

/* floating tab bar */
.tabbar{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;gap:2px;padding:6px;border-radius:999px;background:var(--glass-strong);

.tabbar .tab{position:relative;display:grid;justify-items:center;gap:2px;min-width:78px;padding:7px 14px 6px;border:0;border-radius:999px;background:none;color:var(--muted);font-size:11px;font-weight:600;white-space:nowrap;transition:background .15s ease,color .15s ease}

.pe-preview{top:calc(env(safe-area-inset-top,0px) + 80px);max-height:calc(100vh - 200px)}

.backdrop{background:rgba(10,16,28,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.drawer{background:var(--glass-strong);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border-left:1px solid var(--edge);border-radius:24px 0 0 24px;overflow:hidden;box-shadow:-20px 0 60px rgba(10,20,40,.22)}
.d-head,.d-foot{background:transparent;border-color:var(--line)}

@media (max-width:640px){

}

const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const addDays = (s,n) => { const [y,m,d]=s.split("-").map(Number); const x=new Date(y,m-1,d); x.setDate(x.getDate()+n); return iso(x); };
const daysBetween = (a,b) => { const p=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)}; return Math.round((p(b)-p(a))/864e5); };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = s => { if(!s) return ""; const [y,m,d]=s.split("-").map(Number); return `${MON[m-1]} ${d}`; };
function relDue(s){
  if(!s) return "";
  const n = daysBetween(today(), s);
  if(n===0) return "Today";
  if(n===-1) return "Yesterday";
  if(n<0) return `${-n}d overdue`;
  if(n===1) return "Tomorrow";
  return `in ${n}d`;
}
const money = v => { v=Number(v)||0; if(!v) return "—"; return v>=1000 ? "$"+(v/1000).toFixed(v%1000===0||v>=100000?0:1).replace(/\.0$/,"")+"k" : "$"+v; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- qualification rules ---------- */
function autoTag(l){
  if(l.fit==="No") return "Disqualify";
  if(l.timeline==="Just researching") return "Nurture";
  if(!l.budget || !l.timeline) return "";
  const big = ["$2.5–5k","$5–10k","$10k+"].includes(l.budget);
  const soon = ["ASAP","Within 30 days"].includes(l.timeline);
  return big && soon ? "Hot" : "Warm";
}
const tagOf = l => l.tagOverride || autoTag(l) || "Unqualified";
const FU_DAYS = {Hot:0, Warm:2, Nurture:30};
const TAG_ACTION = {Hot:"Call the same day", Warm:"Follow up within 1–2 days", Nurture:"Email follow-up, check back in 30 days", Disqualify:"Send a polite no or refer out", Unqualified:"Add budget and timeline to tag"};
function tagWhy(l){
  if(l.tagOverride) return "Set by hand";
  if(l.fit==="No") return "Not a fit";
  if(l.timeline==="Just researching") return "Just researching";
  if(!l.budget || !l.timeline) return "Needs budget and timeline";
  return `${l.budget} · ${l.timeline}`;
}
const reachedProposal = l => !!l.proposalSent || l.stage==="Proposal sent" || l.stage==="Won";

    if(f.owner && (l.owner||"")!==f.owner) return false;

/* ---------- Monthly review ---------- */
function periodRange(p){
  const t = today(), [y,m] = t.split("-").map(Number);
  if(p==="this-month") return [`${y}-${pad(m)}-01`, t, `${MON[m-1]} ${y}`];
  if(p==="last-month"){ const d=new Date(y,m-2,1); const e=new Date(y,m-1,0); return [iso(d), iso(e), `${MON[d.getMonth()]} ${d.getFullYear()}`]; }
  if(p==="90") return [addDays(t,-89), t, "the last 90 days"];
  if(p==="year") return [`${y}-01-01`, t, String(y)];
  return ["0000-01-01", t, "all time"];
}
function groupBy(rows, keyFn){
  const m = new Map();
  rows.forEach(l=>{ const k=keyFn(l)||"(not set)"; if(!m.has(k)) m.set(k,{key:k,leads:0,props:0,won:0,value:0,items:[]}); const g=m.get(k); g.leads++; g.items.push(l); if(reachedProposal(l)) g.props++; if(l.stage==="Won"){g.won++; g.value+=Number(l.proposalValue)||0;} });
  return [...m.values()];
}
function barsBlock(groups, sortKey="leads"){
  groups.sort((a,b)=>b[sortKey]-a[sortKey] || b.leads-a.leads);
  const max = Math.max(1,...groups.map(g=>g.leads));
  if(!groups.length) return `<div class="empty">No leads in this period.</div>`;
  return `<div class="bars">${groups.map(g=>`<div class="bar-row">
    <span class="lbl" title="${esc(g.key)}">${esc(g.key)}</span>
    <div class="track" role="img" aria-label="${esc(g.key)}: ${g.leads} leads, ${g.props} proposals, ${g.won} won">
      <span class="b-all" style="width:${g.leads/max*100}%"></span><span class="b-prop" style="width:${g.props/max*100}%"></span><span class="b-won" style="width:${g.won/max*100}%"></span></div>
    <span class="nums"><b>${g.leads}</b> · ${g.props} · ${g.won}</span></div>`).join("")}</div>
    <div class="legend"><span><i style="background:color-mix(in srgb,var(--accent) 28%,transparent)"></i>Leads</span><span><i style="background:color-mix(in srgb,var(--accent) 55%,transparent)"></i>Reached proposal</span><span><i style="background:var(--accent)"></i>Won</span></div>`;
}
const pct = (a,b) => b ? Math.round(a/b*100)+"%" : "—";
function renderReview(){
  const [from,to,label] = periodRange(S.period);
  const rows = S.leads.filter(l=>l.captured && l.captured>=from && l.captured<=to);
  const props = rows.filter(reachedProposal), won = rows.filter(l=>l.stage==="Won"), lost = rows.filter(l=>l.stage==="Lost");
  const wonVal = won.reduce((s,l)=>s+(Number(l.proposalValue)||0),0);

function readForm(){
  const o = {};
  document.querySelectorAll("#drawer [name]").forEach(el=>{
    if(el.type==="checkbox") o[el.name] = el.checked;
    else if(el.type==="number") o[el.name] = el.value==="" ? null : Number(el.value);
    else o[el.name] = el.value.trim();
  });
  return o;
}
function updateSubList(){
  const c = $("#f-category")?.value;
  $("#dl-sub").innerHTML = (c ? SUBS[c] : Object.values(SUBS).flat()).map(x=>`<option value="${esc(x)}">`).join("");
}
function updateTagBox(){
  const o = readForm(); const tg = tagOf(o);
  $("#tagbox").innerHTML = `<span class="tag t-${tg}">${tg}</span><span class="why">${esc(tagWhy(o))} → ${esc(TAG_ACTION[tg])}</span>`;
  const owner = o.owner || (o.category && S.routing[o.category]) || "";
  const fu = o.nextFollowUp || (tg in FU_DAYS ? addDays(today(), FU_DAYS[tg]) : "");
  const h = $("#assign-hint");
  if(h) h.textContent = (!o.owner && owner ? `Will route to ${owner} (${o.category}). ` : "") + (!o.nextFollowUp && fu ? `Follow-up will be set to ${fmtDate(fu)} (${tg}).` : "");
}
function applyRules(o, prev){
  const t = today(), tg = tagOf(o);
  if(!o.owner && o.category && S.routing[o.category]) o.owner = S.routing[o.category];
  if(!o.nextFollowUp && tg in FU_DAYS && (OPEN.includes(o.stage)||o.stage==="Nurture")) o.nextFollowUp = addDays(t, FU_DAYS[tg]);
  if(tg==="Disqualify" && o.stage==="New") o.stage = "Disqualified";
  if(o.stage==="Proposal sent" && !o.proposalSent) o.proposalSent = t;
  if(o.contacted==="" && prev && prev.stage==="New" && o.stage!=="New" && o.stage!=="Disqualified") o.contacted = t;
  // proposal cadence: next unticked of day 2/5/10
  if(o.stage==="Proposal sent" && o.proposalSent){
    const next = [2,5,10].find(n=>!o["fu"+n]);
    const changed = !prev || prev.proposalSent!==o.proposalSent || [2,5,10].some(n=>!!prev["fu"+n]!==!!o["fu"+n]) || prev.stage!=="Proposal sent";
    if(changed) o.nextFollowUp = next ? addDays(o.proposalSent, next) : addDays(t, 30);
  }
  if(o.stage==="Nurture" && (!prev || prev.stage!=="Nurture")) { const n=addDays(t,30); if(!o.nextFollowUp || o.nextFollowUp<n) o.nextFollowUp = n; }
  if(o.stage==="Won" && !o.wonDate) o.wonDate = t;
  if(["Won","Lost","Disqualified"].includes(o.stage)) o.nextFollowUp = "";
  return o;
}
async function saveLead(){
  const msg = $("#d-msg"); msg.className = "msg";
  const o = readForm();
  if(!o.name) return fail("Add the lead's name.", "f-name");
  if(!o.phone && !o.email) return fail("Add a phone number or email.", "f-phone");
  if(!o.ask) return fail("Add what they asked about.", "f-ask");
  if(o.stage==="Lost" && !o.lostReason){ openStep(8); return fail("Pick a lost reason.", "f-lostReason"); }
  const ed = S.editing;
  const prev = ed.isNew ? null : S.leads.find(x=>x.id===ed.id);
  applyRules(o, prev);
  o.updatedAt = new Date().toISOString();
  if(ed.isNew) o.createdAt = o.updatedAt; else o.createdAt = prev?.createdAt || o.updatedAt;
  for(const k in o) if(o[k]==="" || o[k]===null || o[k]===false) delete o[k];
  const btn = document.querySelector('[data-act="save"]'); btn.disabled = true; btn.textContent = "Saving…";
  try{
    const ref = ed.isNew ? S.db.collection("leads").doc() : S.db.doc("leads/"+ed.id);
    await ref.set(o);
    closeDrawer();
  }catch(e){
    btn.disabled = false; btn.textContent = ed.isNew?"Add lead":"Save";
    if(e && e.code==="invalid_argument"){ S.canWrite=false; fail("You don't have permission to change leads here."); render(); }
    else if(e && e.code==="quota_exceeded") fail("The tracker is full. Delete old leads to add new ones.");
    else fail("Couldn't save. Check your connection and try again.");
  }
  function fail(t, focusId){ msg.textContent = t; if(focusId){ const el=document.getElementById(focusId); if(el){ el.closest("details")?.setAttribute("open",""); el.focus(); } } }
}
function openStep(n){ document.querySelector(`details.step[data-step="${n}"]`)?.setAttribute("open",""); }

  if(!deleteArmed){ deleteArmed = true; btn.textContent = "Confirm delete"; setTimeout(()=>{deleteArmed=false; if(btn.isConnected) btn.textContent="Delete";}, 4000); return; }
  deleteArmed = false;
  try{ await S.db.doc("leads/"+S.editing.id).delete(); closeDrawer(); }

function calc(p){
  let one=0, mon=0, monTerm=0;
  (p.lineItems||[]).forEach(i=>{ const amt=(Number(i.price)||0)*(Number(i.qty)||1); if(i.billing==="monthly"){ mon+=amt; monTerm+=amt*(Number(i.term)||1); } else one+=amt; });
  const sub = one+monTerm;
  let disc = p.discountType==="%" ? sub*(Number(p.discount)||0)/100 : (Number(p.discount)||0);
  disc = Math.min(Math.max(disc,0), sub);
  return {one, mon, monTerm, sub, disc, total: sub-disc};
}
function catItem(s){ const c=S.catalog[s]; return c ? {name:s, ...clone(c), qty:1} : null; }
function newProposal(l){
  const first = catItem(l.subService) || {name:l.subService||"Custom service", category:l.category||"", summary:"", deliverables:[], price:Number(l.proposalValue)||0, billing:"one-time", term:1, qty:1, timeline:""};
  const items = [first];
  const intro = `${l.company||l.name}${l.city?" in "+l.city:""} reached out${l.source?" through "+l.source.toLowerCase():""} about: ${l.ask||""}`.trim();
  const parts = [intro];
  if(l.contactNote) parts.push(l.contactNote);
  if(l.tried) parts.push("What you've tried so far: "+l.tried);
  if(l.competitors) parts.push("Competitors we'll measure against: "+l.competitors);
  if(l.dataNotes) parts.push("What the data shows: "+l.dataNotes);
  const id = S.db ? S.db.collection("proposals").doc().id : "local-"+Date.now();
  const t = today();
  return {
    id, leadId:l.id, leadExample:!!l.example, number:"P-"+t.slice(2).replace(/-/g,"")+"-"+Math.random().toString(36).slice(2,5).toUpperCase(),
    status:"Draft", title:`${first.name} for ${l.company||l.name}`, createdAt:t, sentDate:"", validUntil:addDays(t, Number(S.agency.validDays)||14),
    needs:parts.join("\n\n"), goals:l.goals||"",
    approach:`Based on ${l.timeline ? "your timeline ("+l.timeline.toLowerCase()+")" : "what you shared"}, we recommend starting with ${first.name}.`,
    lineItems:items, discount:0, discountType:"$",
    timeline:first.timeline ? `${first.name}: ${first.timeline}` : "", terms:S.agency.paymentTerms
  };
}
function suggestions(p){
  const have = new Set(p.lineItems.map(i=>i.name));
  const out = [];
  p.lineItems.forEach(i=>(PAIRINGS[i.name]||[]).forEach(s=>{ if(!have.has(s) && !out.includes(s) && S.catalog[s]) out.push(s); }));
  const cat = p.lineItems[0]?.category;
  (SUBS[cat]||[]).forEach(s=>{ if(!have.has(s) && !out.includes(s)) out.push(s); });
  return out.filter(s=>s!=="Free consult").slice(0,6);
}

async function saveProp(status){
  readProp();
  const p = S.prop;
  if(propRO(p)) return;
  if(!p.title.trim()) return propMsg("Add a proposal title.");
  if(!p.lineItems.length) return propMsg("Add at least one service.");
  const prevStatus = p.status;
  if(status){ p.status = status; if(status==="Sent" && !p.sentDate) p.sentDate = today(); }
  const doc = clone(p); delete doc.id; delete doc.example; delete doc.leadExample;
  doc.updatedAt = new Date().toISOString();
  document.querySelectorAll("[data-pact]").forEach(b=>b.disabled=true);
  try{
    await S.db.doc("proposals/"+p.id).set(doc);
    p.updatedAt = doc.updatedAt;
    if(status==="Sent") await syncLead(p, "sent");
    if(status==="Accepted") await syncLead(p, "accepted");
    S.propDirty = false;
    if(status==="Declined"){ const lid=p.leadId; S.prop=null; renderProposals(); declineLead(lid); return; }
    renderPropEditor();
    propMsg(status==="Sent" ? "Marked sent. The lead moved to Proposal sent, with follow-ups on day 2, 5 and 10."
      : status==="Accepted" ? "Marked accepted. The lead moved to Won; onboarding is in step 09 of the lead." : "Saved.", true);
  }catch(e){
    p.status = prevStatus;
    renderPropEditor();
    if(e && e.code==="invalid_argument"){ S.canWrite=false; propMsg("You don't have permission to change proposals here."); }
    else propMsg("Couldn't save. Check your connection and try again.");
  }
}
async function syncLead(p, kind){
  const prev = leadOf(p); if(!prev || prev.example) return;
  const c = calc(p);
  const o = {...prev}; delete o.id;
  o.proposalId = p.id; o.proposalValue = Math.round(c.total);
  o.proposalScope = p.lineItems.map(i=>i.name).join(", ");
  if(kind==="sent"){
    if(o.proposalSent!==p.sentDate){ o.fu2=false; o.fu5=false; o.fu10=false; }
    o.proposalSent = p.sentDate;
    if(o.stage!=="Won") o.stage = "Proposal sent";
  }
  if(kind==="accepted"){ o.stage = "Won"; if(!o.wonDate) o.wonDate = today(); }
  if(o.contacted===undefined) o.contacted = "";
  if(o.nextFollowUp===undefined) o.nextFollowUp = "";
  applyRules(o, prev);
  o.updatedAt = new Date().toISOString();
  for(const k in o) if(o[k]==="" || o[k]===null || o[k]===false || o[k]===undefined) delete o[k];
  await S.db.doc("leads/"+prev.id).set(o);
}
function declineLead(lid){
  if(!S.leads.find(l=>l.id===lid)) return;
  openLead(lid);
  const st = $("#f-stage"); if(st && !st.disabled) st.value = "Lost";
  openStep(8); updateTagBox();
  const lr = $("#f-lostReason"); if(lr) lr.focus();
  const m = $("#d-msg"); if(m){ m.className="msg"; m.textContent = "Proposal marked declined. Pick a lost reason and save."; }
}
async function downloadProp(){
  readProp();
  const p = S.prop, l = leadOf(p)||{};
  const name = `Proposal - ${l.company||l.name||"Client"} - ${p.sentDate||today()}.html`.replace(/[\\/:*?"<>|]+/g,"");
  try{ await S.downloads.save({filename:name, data:standaloneDoc(p)}); propMsg("Downloaded. Open the file in a browser to save it as PDF.", true); }
  catch(e){ if(e && e.code==="declined") return; if(e && e.code==="rate_limited") return propMsg("A download prompt is already open."); propMsg("Couldn't download the file here."); }
}
function switchView(v){
  S.view = v;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", t.dataset.view===v));
  document.querySelectorAll(".view").forEach(x=>x.hidden = x.id!=="view-"+v);
  try{ localStorage.setItem("ld-view", v); }catch{}
  S.settingsDirty = false;
  render(); if(v==="proposals" && S.prop) renderPropEditor(); window.scrollTo(0,0);
}
function openProposal(id){
  const p = propsList().find(x=>x.id===id); if(!p) return;
  S.prop = clone(p); S.propDirty = false; closeDrawer(); switchView("proposals");
}
function startProposal(leadId){
  const l = S.leads.find(x=>x.id===leadId); if(!l) return;
  S.prop = newProposal(l); S.propDirty = true; closeDrawer(); switchView("proposals");
  propMsg(propRO(S.prop) ? "Example lead. You can preview and download, but not save." : "Draft built from the lead's needs. Adjust it, then Save draft or Mark sent.", !propRO(S.prop));
}
function propBlock(l, isNew){
  if(isNew) return "";
  const ps = propsList().filter(p=>p.leadId===l.id);
  return `<div class="field full"><span class="lab">Proposals for this lead</span><div class="plist">
    ${ps.map(p=>`<button type="button" class="plink" data-pid="${esc(p.id)}"><span class="pst ps-${esc(p.status)}">${esc(p.status)}</span><span class="t">${esc(p.title)}</span><span class="mono">${money(calc(p).total)}</span></button>`).join("")}
    <button type="button" class="btn small primary" data-pact="new-for" data-lead="${esc(l.id)}" style="justify-self:start">+ Create proposal from this lead</button>
  </div></div>`;
}
let propArm = "";
function propAction(act, el){
  if(act==="new-for") return startProposal(el.dataset.lead);
  if(act==="new-pick"){ const v=$("#pp-lead")?.value; if(!v){ $("#pp-lead")?.focus(); return; } return startProposal(v); }
  if(act==="save-catalog") return saveCatalog();
  const p = S.prop; if(!p) return;
  if(act==="back"){
    if(S.propDirty && !propRO(p) && propArm!=="back"){ propArm="back"; el.textContent="Discard changes?"; setTimeout(()=>{ propArm=""; if(el.isConnected) el.textContent="← All proposals"; }, 4000); return; }
    propArm=""; S.prop=null; S.propDirty=false; renderProposals(); return;
  }
  if(act==="open-lead"){ if(leadOf(p)) openLead(p.leadId); return; }
  if(act==="download") return downloadProp();
  if(act==="save") return saveProp(null);
  if(act==="sent") return saveProp("Sent");
  if(act==="accepted") return saveProp("Accepted");
  if(act==="declined") return saveProp("Declined");
  if(act==="delete"){
    if(propArm!=="delete"){ propArm="delete"; el.textContent="Confirm delete"; setTimeout(()=>{ propArm=""; if(el.isConnected) el.textContent="Delete"; }, 4000); return; }
    propArm="";
    S.db.doc("proposals/"+p.id).delete().then(()=>{ S.prop=null; renderProposals(); }).catch(()=>propMsg("Couldn't delete. Try again."));
    return;
  }
  readProp();
  if(act==="dup"){
    const n = clone(p); n.id = S.db ? S.db.collection("proposals").doc().id : "local-"+Date.now();
    n.status="Draft"; n.sentDate=""; n.createdAt=today(); delete n.updatedAt; n.validUntil=addDays(today(), Number(S.agency.validDays)||14);
    n.number = p.number.replace(/-v\d+$/,"") + "-v" + (propsList().filter(x=>x.leadId===p.leadId).length+1);
    n.title = p.title.replace(/ \(copy\)$/,"") + " (copy)";
    S.prop = n; S.propDirty = true; renderPropEditor(); propMsg("Copy created as a new draft. Save it to keep it.", true); return;
  }
  const i = Number(el.dataset.i);
  if(act==="up" && i>0) [p.lineItems[i-1], p.lineItems[i]] = [p.lineItems[i], p.lineItems[i-1]];
  if(act==="down" && i<p.lineItems.length-1) [p.lineItems[i+1], p.lineItems[i]] = [p.lineItems[i], p.lineItems[i+1]];
  if(act==="remove") p.lineItems.splice(i,1);
  const add = s => { const it=catItem(s); if(it){ p.lineItems.push(it); if(it.timeline && !(p.timeline||"").includes(s)) p.timeline = ((p.timeline?p.timeline+"\n":"") + `${s}: ${it.timeline}`); } };
  if(act==="add-sug") add(el.dataset.sub);
  if(act==="add-cat"){ const v=$("#pe-addsel")?.value; if(!v) return; add(v); }
  if(act==="add-custom") p.lineItems.push({name:"Custom service", category:"", summary:"", deliverables:[], price:0, billing:"one-time", term:1, qty:1, timeline:""});
  S.propDirty = true; renderPropEditor();
  if(act==="add-custom"){ const el2=document.getElementById(`pe-li${p.lineItems.length-1}-name`); if(el2){ el2.focus(); el2.select(); } }
}

/* ---------- Settings: catalog ---------- */
function catalogHTML(){
  const dis = (!S.canWrite || !S.db) ? "disabled" : "";
  const a = S.agency;
  return `
    <div class="panel"><div class="panel-h"><h2>Service catalog</h2><span class="rule">Rates and scope that proposals start from</span></div>
      ${S.catalogSaved ? "" : `<div class="insight" style="border-top:0"><b style="color:var(--warm)">Placeholder prices.</b> Set your real rates for each service and save.</div>`}
      <div class="catwrap">${CATEGORIES.map((c,ci)=>`<details class="step"><summary><h3>${esc(c)}</h3><span class="hint">${SUBS[c].map(s=>esc(s)).join(" · ")}</span></summary>
        ${SUBS[c].map((s,si)=>{ const it=S.catalog[s]||DEFAULT_CATALOG[s]; const id=k=>`cs-${ci}-${si}-${k}`;
          return `<div class="cat-item" data-cs="${esc(s)}"><b>${esc(s)}</b>
            <div class="grid4">
              <div class="field"><label for="${id("price")}">Price (USD)</label><input id="${id("price")}" data-k="price" type="number" min="0" step="50" value="${esc(it.price)}" ${dis}></div>
              <div class="field"><label for="${id("billing")}">Billing</label><select id="${id("billing")}" data-k="billing" ${dis}><option value="one-time" ${it.billing!=="monthly"?"selected":""}>One-time</option><option value="monthly" ${it.billing==="monthly"?"selected":""}>Monthly</option></select></div>
              <div class="field"><label for="${id("term")}">Min. months</label><input id="${id("term")}" data-k="term" type="number" min="1" step="1" value="${esc(it.term)}" ${dis}></div>
              <div class="field"><label for="${id("timeline")}">Timeline</label><input id="${id("timeline")}" data-k="timeline" value="${esc(it.timeline)}" ${dis}></div>
            </div>
            <div class="grid2">
              <div class="field"><label for="${id("summary")}">What it does</label><textarea id="${id("summary")}" data-k="summary" rows="3" ${dis}>${esc(it.summary)}</textarea></div>
              <div class="field"><label for="${id("deliverables")}">Deliverables (one per line)</label><textarea id="${id("deliverables")}" data-k="deliverables" rows="3" ${dis}>${esc((it.deliverables||[]).join("\n"))}</textarea></div>
            </div></div>`; }).join("")}
      </details>`).join("")}</div>
      <div class="panel-h" style="border-top:1px solid var(--line)"><h2>Agency details</h2><span class="rule">Shown on every proposal</span></div>
      <div class="grid" style="padding-top:12px">
        <div class="field"><label for="ag-name">Agency name</label><input id="ag-name" data-ag="name" value="${esc(a.name)}" ${dis}></div>
        <div class="field"><label for="ag-contact">Contact line</label><input id="ag-contact" data-ag="contact" value="${esc(a.contact)}" placeholder="Email · phone · website" ${dis}></div>
        <div class="field"><label for="ag-validDays">Proposals valid for (days)</label><input id="ag-validDays" data-ag="validDays" type="number" min="1" value="${esc(a.validDays)}" ${dis}></div>
        <div class="field"><label for="ag-footer">Footer</label><input id="ag-footer" data-ag="footer" value="${esc(a.footer)}" placeholder="Company address, registration…" ${dis}></div>
        <div class="field full"><label for="ag-paymentTerms">Default terms</label><textarea id="ag-paymentTerms" data-ag="paymentTerms" rows="4" ${dis}>${esc(a.paymentTerms)}</textarea></div>
      </div>
      <div class="d-foot" style="border-radius:0 0 var(--r) var(--r)"><span class="msg" id="cat-msg"></span><button class="btn primary" type="button" data-pact="save-catalog" ${dis}>Save catalog &amp; agency details</button></div>
    </div>`;
}
async function saveCatalog(){
  const m = $("#cat-msg"); m.className = "msg";
  const items = {};
  document.querySelectorAll("[data-cs]").forEach(box=>{
    const s = box.dataset.cs, g = k => box.querySelector(`[data-k="${k}"]`).value;
    items[s] = {category: DEFAULT_CATALOG[s]?.category || "", price:Number(g("price"))||0, billing:g("billing"), term:Math.max(1,Number(g("term"))||1), timeline:g("timeline").trim(), summary:g("summary").trim(), deliverables:g("deliverables").split("\n").map(x=>x.trim()).filter(Boolean)};
  });
  const agency = {};
  document.querySelectorAll("[data-ag]").forEach(el=>agency[el.dataset.ag] = el.type==="number" ? (Number(el.value)||14) : el.value.trim());
  try{ await S.db.doc("config/catalog").set({items, agency, updatedAt:new Date().toISOString()}); m.className="msg ok"; m.textContent="Saved. New proposals use these rates."; }
  catch(e){ m.textContent = e && e.code==="invalid_argument" ? "You don't have permission to change the catalog." : "Couldn't save. Try again."; }
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const tab = e.target.closest(".tab");
  if(tab){ switchView(tab.dataset.view); return; }
  const propRow = e.target.closest("[data-prop]");
  if(propRow){ openProposal(propRow.dataset.prop); return; }
  const pidEl = e.target.closest("[data-pid]");
  if(pidEl){ openProposal(pidEl.dataset.pid); return; }
  const pact = e.target.closest("[data-pact]");
  if(pact){ if(!pact.disabled) propAction(pact.dataset.pact, pact); return; }
  const pchip = e.target.closest(".chip[data-pstatus]");
  if(pchip){ S.propFilter = pchip.dataset.pstatus; renderPropList(); return; }
  const act = e.target.closest("[data-act]")?.dataset.act;
  if(act==="new"){ openLead(null); return; }
  if(act==="close"){ closeDrawer(); return; }
  if(act==="save"){ saveLead(); return; }
  if(act==="delete"){ deleteLead(e.target.closest("[data-act]")); return; }
  if(e.target.id==="btn-new"){ openLead(null); return; }
  if(e.target.id==="backdrop"){ closeDrawer(); return; }
  const chip = e.target.closest(".chip[data-stage]");
  if(chip){ S.filter.stage = chip.dataset.stage; renderPipeline(); return; }
  const th = e.target.closest("th[data-sort]");
  if(th){ const k=th.dataset.sort; S.sort = {key:k, dir: S.sort.key===k ? -S.sort.dir : 1}; renderPipeline(); return; }
  if(e.target.id==="rt-save"){ saveRouting(); return; }
  const row = e.target.closest("[data-id]");
  if(row && !e.target.closest("#drawer")){ openLead(row.dataset.id); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && !$("#drawer").hidden){ closeDrawer(); return; }
  if(e.key==="Enter" && e.target.matches("[data-prop]")){ openProposal(e.target.dataset.prop); return; }
  if(e.key==="Enter" && e.target.matches("tr[data-pid]")){ openProposal(e.target.dataset.pid); return; }
  if(e.key==="Enter" && e.target.matches("[data-id]")) openLead(e.target.dataset.id);
});
document.addEventListener("input", e=>{
  if(e.target.closest("#pe-form")){ onPropInput(e); return; }
  if(e.target.closest("#view-routing")){ S.settingsDirty = true; return; }
  if(e.target.id==="f-q"){ S.filter.q = e.target.value; renderPipeline(); }
});
document.addEventListener("change", e=>{
  const id = e.target.id;
  if(e.target.closest("#pe-form")){ onPropInput(e); return; }
  if(e.target.closest("#view-routing")){ S.settingsDirty = true; return; }
  if(["f-tag","f-category","f-owner","f-source"].includes(id) && e.target.closest("#view-pipeline")){ S.filter[id.slice(2)] = e.target.value; renderPipeline(); return; }
  if(id==="f-period"){ S.period = e.target.value; renderReview(); return; }
  if(e.target.closest("#drawer")){
    if(id==="f-category") updateSubList();
    updateTagBox();
  }
});

async function saveRouting(){
  const m = $("#rt-msg"); m.className="msg";
  const owners = {}; document.querySelectorAll("#view-routing input[data-cat]").forEach(i=>owners[i.dataset.cat]=i.value.trim());
  try{ await S.db.doc("config/routing").set({owners, updatedAt:new Date().toISOString()}); m.className="msg ok"; m.textContent="Saved. New leads route to these owners."; }
  catch(e){ m.textContent = e && e.code==="invalid_argument" ? "You don't have permission to change routing." : "Couldn't save. Try again."; }
}

/* ---------- data ---------- */
try{ const v = localStorage.getItem("ld-view"); if(v && document.querySelector(`.tab[data-view="${v}"]`)) document.querySelector(`.tab[data-view="${v}"]`).click(); }catch{}
render();

(async ()=>{
  if(window.claude?.use) window.claude.use("downloads").then(d=>{ S.downloads = d; if(S.view==="proposals" && S.prop){ readProp(); renderPropEditor(); } }).catch(()=>{});
  const db = window.claude?.use ? await window.claude.use("db") : null;
  S.connecting = false;
  if(!db){ render(); return; }
  S.db = db;
  const timer = setTimeout(()=>{ if(!S.live){ const b=$("#banner"); b.hidden=false; b.innerHTML=`<span><b>Can't reach saved leads yet.</b> Showing examples until the connection comes back.</span>`; } }, 10000);
  db.collection("leads").onSnapshot(snap=>{
    if(!snap.metadata.fromCache){ S.live = true; clearTimeout(timer); }
    const real = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(real.length){ S.leads = real; S.preview = false; }
    else if(!snap.metadata.fromCache){ S.leads = samples(); S.preview = true; }
    render();
    if(S.editing && !S.editing.isNew && !S.leads.find(x=>x.id===S.editing.id)) closeDrawer();
  }, err=>{ clearTimeout(timer); S.db = null; render(); });
  db.collection("proposals").onSnapshot(snap=>{
    S.realProposals = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }, ()=>{});
  db.doc("config/catalog").onSnapshot(snap=>{
    if(!snap.exists) return;
    const d = snap.data();
    S.catalog = {...clone(DEFAULT_CATALOG), ...(d.items||{})};
    S.agency = {...DEFAULT_AGENCY, ...(d.agency||{})};
    S.catalogSaved = true;
    render();
  }, ()=>{});
  db.doc("config/routing").onSnapshot(snap=>{
    if(snap.exists){ const o = snap.data().owners || {}; S.routing = {...S.routing, ...o}; S.routingSaved = true; if(S.view==="routing" && !S.settingsDirty) renderRouting(); fillDatalists(); }
  }, ()=>{});
  try{
    const user = await window.claude.use("user");
    if(user){ const c = await user.can("data.write"); if(c===false){ S.canWrite = false; render(); } }
  }catch{}
})();
})();
</script>

</body></html>
