[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  # Ship files and node_modules as-is (no bundling). Express and serverless-http are
  # CommonJS and load Node built-ins with require(), which breaks inside an ES module bundle.
  node_bundler = "nft"
  # The function imports ../../server/*; make sure those files are included.
  included_files = ["server/**"]

# /api/* is routed to the function by its own `config.path` (netlify/functions/api.mjs).
# Functions with a path run before the redirect below. Same origin, so the session cookie just works.

# Single-page app: every other path serves the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
